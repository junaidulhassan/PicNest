# Picnest system-wide scanning configuration
#
# Paths listed under [excluded-paths] are never scanned for photos or videos.
# Folder names listed under [excluded-names] are skipped wherever they appear.
# Personal settings are changed in Picnest Preferences and stored per user.

[excluded-paths]
/var
/usr
/opt

[excluded-names]
node_modules
__pycache__
.git
